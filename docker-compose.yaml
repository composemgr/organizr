# nginx proxy address - http://172.17.0.1:64287

name: organizr
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  server:
    image: organizr/organizr:latest
    container_name: organizr-server
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: organizr-server
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      PUID: ${SERVICE_USER:-1000}
      PGID: ${SERVICE_GROUP:-1000}
    ports:
      - '172.17.0.1:64287:80'
    volumes:
      - './volumes/config/organizr:/config'
    networks:
      - organizr

networks:
  organizr:
    name: organizr
    external: false
